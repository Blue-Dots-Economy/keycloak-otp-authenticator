name: Dependency Check

# OWASP Dependency-Check does NOT belong on the PR path.
#
# It reports on the dependency set, which changes on a dependency bump — not on
# each PR — so running it per-PR buys no signal a weekly run doesn't. What it
# does buy is latency: the first run on this repo spent 55+ minutes in a cold
# NVD sync while `continue-on-error: true` guaranteed it could not fail
# anything. Every PR into `main` and `enhancements` would have paid that.
#
# Here it runs weekly with a warm NVD cache, and WITHOUT continue-on-error, so
# the pom's failBuildOnCVSS=7 is finally load-bearing instead of decorative.
on:
  schedule:
    # Mondays 03:00 UTC. Also keeps the NVD cache inside GitHub's 7-day
    # idle-eviction window, which a quiet repo would otherwise fall out of.
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-check
  cancel-in-progress: false

jobs:
  owasp:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          # Deliberately NO `cache: maven` here. That caches all of
          # ~/.m2/repository, which CONTAINS the NVD data directory below — the
          # two would overlap and save a multi-GB entry keyed on pom hashes.
          # The NVD data is cached explicitly instead; the handful of plugin
          # jars this job needs are cheap to refetch.

      - name: Week stamp for the cache key
        id: stamp
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Cache NVD database
        uses: actions/cache@v4
        with:
          # dependency-check-maven's default dataDirectory.
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ steps.stamp.outputs.week }}
          # Restore last week's database even on a key miss, so the plugin does
          # an incremental update instead of a full cold sync. This restore-key
          # is what actually keeps the job short.
          restore-keys: |
            nvd-

      - name: OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -n "$NVD_API_KEY" ]; then
            mvn dependency-check:aggregate -B -DnvdApiKey="$NVD_API_KEY"
          else
            echo "::warning title=No NVD API key::Set the NVD_API_KEY secret (free from https://nvd.nist.gov/developers/request-an-api-key). Without it the NVD API throttles to ~5 requests/30s instead of 50, and a cold sync can exceed this job's timeout."
            mvn dependency-check:aggregate -B
          fi

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          if-no-files-found: ignore
