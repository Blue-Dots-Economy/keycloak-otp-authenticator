name: CI

on:
  push:
    # `enhancements`, not just main. The SMS vendor providers live only on that
    # branch and it is what the deployed jar is built from, so every PR into the
    # branch that actually ships was merging with no build, no tests and no
    # security scan. The repo has zero workflow runs to date for this reason.
    branches: [main, enhancements]
    tags: ['v*']
  pull_request:
    branches: [main, enhancements]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Build and test
        run: mvn clean verify -B

      - name: Upload single JAR
        uses: actions/upload-artifact@v4
        with:
          name: keycloak-otp
          path: dist/target/keycloak-otp-*.jar
          if-no-files-found: error

  security:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: SpotBugs + Find Security Bugs
        run: mvn compile spotbugs:check -B

      # The NVD feed is ~391k records. Unauthenticated, the API rate-limits to
      # roughly 10k per 2-3 minutes, so a cold run takes ~100 MINUTES and the
      # job gets cancelled before finishing — which is exactly what happened on
      # this workflow's first-ever run, taking the `release` job down with it
      # via `needs`. Two mitigations, because either alone is not enough:
      #
      #   * Cache the downloaded data so only the delta is fetched after the
      #     first successful populate. Keyed by date so it refreshes daily and
      #     cannot silently scan against a stale feed.
      #   * An optional NVD_API_KEY, which raises the rate limit by orders of
      #     magnitude. Unset it still works, just slowly — hence restore-keys
      #     and the step timeout below rather than a hard requirement.
      - name: Cache NVD data
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}-${{ github.run_id }}
          restore-keys: |
            nvd-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}-
            nvd-${{ runner.os }}-

      - name: OWASP Dependency-Check
        # Bounded so a slow NVD populate degrades to a skipped scan instead of
        # hanging the job. Paired with continue-on-error, which is what keeps
        # `release` reachable when this does time out.
        timeout-minutes: 20
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -n "${NVD_API_KEY:-}" ]; then
            mvn dependency-check:aggregate -B -Dnvd.api.key="$NVD_API_KEY"
          else
            echo "::warning::NVD_API_KEY not set — the NVD populate is rate-limited and may time out."
            mvn dependency-check:aggregate -B
          fi
        continue-on-error: true

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build, security]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Build release JAR
        run: mvn clean package -DskipTests -B

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/target/keycloak-otp-*.jar
          generate_release_notes: true
